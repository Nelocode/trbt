version: '3.8'

# ==============================================================================
# RocketBot Pro - Docker Compose Multi-Servicio para Producción & Easypanel
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # Opción 1 (Recomendada Easypanel): Contenedor Unificado Todo-en-Uno (Fullstack)
  # ----------------------------------------------------------------------------
  rocketbot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rocketbot-pro
    restart: unless-stopped
    ports:
      - "${PORT:-8090}:8090"
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8090
      - HOST=0.0.0.0
      - TZ=UTC
      - JWT_SECRET=${JWT_SECRET:-}
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M
    volumes:
      - ./user_data:/app/user_data
    networks:
      - rocketbot-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8090/api/v1/system/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  rocketbot-net:
    driver: bridge

server {
    listen 3000;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Archivos estáticos de Vite con cache largo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # Redirección de SPA (Single Page Application)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy inverso transparente a la API Backend
    location /api/ {
        proxy_pass http://rocketbot-backend:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy inverso para WebSockets en tiempo real
    location /ws/ {
        proxy_pass http://rocketbot-backend:8090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
